<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Village d'IA — jeu de vie isométrique</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #1a1f2b;
    }

    #app {
      position: fixed;
      inset: 0;
      /* Désactive scroll/zoom natif sur le canvas : nos handlers Pointer Events
         pilotent intégralement la caméra (pan 1 doigt, pinch zoom 2 doigts). */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #app canvas {
      touch-action: none;
    }

    .hud {
      position: fixed;
      color: #fff;
      font-size: 13px;
      user-select: none;
    }

    #topbar {
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(0, 0, 0, .55);
      padding: 6px 10px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    button {
      font: inherit;
      color: #fff;
      background: #3a4252;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #4a5266;
    }

    #speed {
      display: flex;
      gap: 4px;
      padding: 4px 6px;
      align-items: center;
    }

    #speed button {
      padding: 3px 7px;
      font-size: 12px;
      background: transparent;
      border: 1px solid transparent;
    }

    #speed button:hover {
      background: #4a5266;
    }

    #speed button.active {
      background: #06d6a0;
      border-color: #06d6a0;
      color: #06281f;
      font-weight: 600;
    }

    #panel {
      top: max(8px, env(safe-area-inset-top));
      right: 8px;
      width: 260px;
      max-width: calc(100vw - 16px);
      background: rgba(0, 0, 0, .6);
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    #panel h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    /* Croix de fermeture du panneau agent (utile surtout sur mobile, où il n'y a
       pas de "désélection" naturelle). Au coin haut-droit du panneau. */
    #closePanel {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 30px;
      height: 30px;
      padding: 0;
      line-height: 28px;
      font-size: 18px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
    }
    #closePanel:hover { background: rgba(255,255,255,.08); }

    .need {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
    }

    .need span {
      width: 56px;
      opacity: .8;
    }

    .bar {
      flex: 1;
      height: 7px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar>i {
      display: block;
      height: 100%;
      background: #06d6a0;
    }

    #goal {
      font-style: italic;
      opacity: .85;
      margin: 6px 0;
    }

    #chatrow {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    #chatrow input {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
    }

    #log {
      bottom: max(8px, env(safe-area-inset-bottom));
      left: 8px;
      width: 320px;
      max-width: calc(100vw - 16px);
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0, 0, 0, .5);
      padding: 8px 10px;
      border-radius: 8px;
    }

    #log div {
      margin: 2px 0;
    }

    #log b {
      color: #ffd166;
    }

    .hint {
      bottom: max(8px, env(safe-area-inset-bottom));
      right: 8px;
      opacity: .6;
      max-width: 50vw;
      text-align: right;
    }

    /* Sur mobile, le log et le panel se partagent l'écran : on rétrécit le log
       quand le panel est ouvert (le panel garde la priorité d'affichage). */
    @media (max-width: 540px) {
      #log {
        max-height: 22vh;
        width: calc(100vw - 16px);
        font-size: 12px;
      }
      #panel {
        max-height: calc(100vh - 80px);
        overflow-y: auto;
      }
      .hint {
        display: none; /* place limitée, gestes appris vite */
      }
      #topbar .pill { padding: 5px 8px; font-size: 12px; }
      #speed button { padding: 6px 9px; min-width: 30px; min-height: 32px; }
      button { min-height: 36px; }
    }

    #startup {
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 13, 20, .85);
      backdrop-filter: blur(3px);
      z-index: 10;
    }

    #startup .card {
      background: #232a38;
      padding: 24px;
      border-radius: 14px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }

    #startup h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    #startup p {
      margin: 0 0 16px;
      opacity: .7;
      font-size: 13px;
    }

    #startup .modes {
      display: flex;
      gap: 8px;
    }

    #startup .modes button {
      flex: 1;
      padding: 12px;
    }

    #startup .modes button.active {
      background: #06d6a0;
      border-color: #06d6a0;
      color: #06281f;
      font-weight: 600;
    }

    #startup .srv {
      margin-top: 12px;
      display: none;
    }

    #startup .srv input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #1a1f2b;
      color: #fff;
    }

    #startup label.remember {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      opacity: .8;
      font-size: 12px;
    }

    #startup #playBtn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #3a8dde;
      border-color: #3a8dde;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="topbar" class="hud">
    <div class="pill" id="clock">--:--</div>
    <div class="pill" id="date">—</div>
    <div class="pill" id="speed">
      <button data-speed="0" title="Pause">⏸</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="5">5×</button>
      <button data-speed="20">20×</button>
      <button data-speed="100">100×</button>
      <button data-speed="1000">1000×</button>
    </div>
    <div class="pill" id="mode">…</div>
    <button id="voiceBtn">🔊 Voix : off</button>
  </div>
  <div id="panel" class="hud">
    <button id="closePanel" aria-label="Fermer">×</button>
    <h2 id="pname">—</h2>
    <div id="pactivity" style="opacity:.8"></div>
    <div id="plife" style="opacity:.8; font-size:12px; margin:2px 0"></div>
    <div id="goal"></div>
    <div id="inv" style="opacity:.85; margin:4px 0; font-size:12px"></div>
    <div id="needs"></div>
    <div id="chatrow">
      <input id="chatInput" placeholder="Parler / donner un ordre…" />
      <button id="sendBtn">↵</button>
    </div>
  </div>
  <div id="log" class="hud"></div>
  <div id="hint" class="hud hint">Tap = sélectionner • glisser = déplacer • pincer / molette = zoom</div>
  <div id="startup" class="hud" style="display: none;">
    <div class="card">
      <h1>Village d'IA</h1>
      <p>Où faire tourner la simulation ?</p>
      <div class="modes">
        <button id="modeLocal" data-mode="local">🖥️ Jeu local<br /><small>dans le navigateur</small></button>
        <button id="modeServer" data-mode="server">🌐 Serveur distant<br /><small>monde partagé</small></button>
      </div>
      <div class="srv" id="srvRow">
        <input id="srvUrl" placeholder="wss://…" />
      </div>
      <label class="remember"><input type="checkbox" id="remember" /> Se souvenir de mon choix</label>
      <button id="playBtn">Jouer</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
