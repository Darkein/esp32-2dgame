<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Village d'IA — jeu de vie isométrique</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1f2b; }
      #app { position: fixed; inset: 0; }
      .hud { position: fixed; color: #fff; font-size: 13px; user-select: none; }
      #topbar { top: 8px; left: 8px; display: flex; gap: 8px; align-items: center; }
      .pill { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; backdrop-filter: blur(4px); }
      button { font: inherit; color: #fff; background: #3a4252; border: 1px solid #555; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      button:hover { background: #4a5266; }
      #panel { top: 8px; right: 8px; width: 260px; background: rgba(0,0,0,.6); padding: 12px; border-radius: 10px; display: none; }
      #panel h2 { margin: 0 0 4px; font-size: 16px; }
      .need { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      .need span { width: 56px; opacity: .8; }
      .bar { flex: 1; height: 7px; background: #333; border-radius: 4px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: #06d6a0; }
      #goal { font-style: italic; opacity: .85; margin: 6px 0; }
      #chatrow { display: flex; gap: 4px; margin-top: 8px; }
      #chatrow input { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #555; background: #222; color: #fff; }
      #log { bottom: 8px; left: 8px; width: 320px; max-height: 30vh; overflow-y: auto; background: rgba(0,0,0,.5); padding: 8px 10px; border-radius: 8px; }
      #log div { margin: 2px 0; }
      #log b { color: #ffd166; }
      .hint { bottom: 8px; right: 8px; opacity: .6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="topbar" class="hud">
      <div class="pill" id="clock">--:--</div>
      <div class="pill" id="mode">…</div>
      <button id="voiceBtn">🔊 Voix : off</button>
    </div>
    <div id="panel" class="hud">
      <h2 id="pname">—</h2>
      <div id="pactivity" style="opacity:.8"></div>
      <div id="goal"></div>
      <div id="inv" style="opacity:.85; margin:4px 0; font-size:12px"></div>
      <div id="needs"></div>
      <div id="chatrow">
        <input id="chatInput" placeholder="Parler / donner un ordre…" />
        <button id="sendBtn">↵</button>
      </div>
    </div>
    <div id="log" class="hud"></div>
    <div id="hint" class="hud hint">Clic = sélectionner • glisser = déplacer • molette = zoom</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
